[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dincli"
version = "0.2.0"
description = "Command-line interface for Decentralized Intelligence Network"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Umer Majeed", email = "umermjd11@gmail.com"},
  { name = "Abraham Nash", email = "abrahamnash@protonmail.com"}
]
license = { text = "MIT" }
keywords = ["blockchain", "federated-learning", "privacy", "cli", "fastapi", "DIN"]

dependencies = [
  "typer>=0.9.0",
  "click>=8.1.0",
  "rich>=13.0.0,<15.0.0",
  "python-dotenv>=1.0.0",
  "web3>=6.0.0",
  "requests>=2.31.0",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "platformdirs>=4.3.0",
  "numpy>=2.2.0",
  "py-cid>=0.5.0"

]

[project.scripts]
dincli = "dincli.main:app"

# ✅ Let setuptools auto-find packages (including 'dincli')
[tool.setuptools.packages.find]
where = ["."]  # look in project root
include = ["dincli*"]  # only include dincli and subpackages

# accounts.json is gitignored, local-only runtime state (populated by
# `dincli system register-wallet`) — never ship whatever happens to be on
# the build machine's disk.
[tool.setuptools.exclude-package-data]
"dincli.config" = ["accounts.json"]