# DIN Protocol — The Graph subgraph schema
#
# Covers the six platform contracts:
#   DINModelRegistry, DinValidatorStake, DinCoordinator, DinToken,
#   DinFeeRouter, DinTreasury
# and the per-model task contracts (DINTaskCoordinator, DINTaskAuditor) via
# dynamic data source templates.
#
# Chain: chainId 1337 (local anvil).
# Some registry fields not carried in their events (e.g. isOpenSource and
# feePaid on ModelRegistrationRequest) are read from contract storage by the
# mapping handler at the event's block.

# ─────────────────────────────────────────────────────────────────────────────
# Model Registry — registration requests
# ─────────────────────────────────────────────────────────────────────────────

"""A request submitted by a model owner for DAO review and approval."""
type ModelRegistrationRequest @entity {
  "requestId as decimal string"
  id: ID!

  requestId: BigInt!
  requester: Bytes!

  "Read from modelRequests() storage at the request block"
  isOpenSource: Boolean!

  "Fee paid at submission time in wei, read from modelRequests() storage"
  feePaid: BigInt!

  manifestCID: Bytes!
  taskCoordinator: Bytes!
  taskAuditor: Bytes!

  processed: Boolean!
  approved: Boolean

  "Set when the request is approved"
  model: Model

  submittedAtBlock: BigInt!
  submittedAtTimestamp: BigInt!
  processedAtBlock: BigInt
  processedAtTimestamp: BigInt
}

# ─────────────────────────────────────────────────────────────────────────────
# Model Registry — approved models
# ─────────────────────────────────────────────────────────────────────────────

"""An approved federated-learning model registered on the DIN protocol."""
type Model @entity {
  "modelId as decimal string"
  id: ID!

  modelId: BigInt!
  owner: Bytes!
  isOpenSource: Boolean!
  manifestCID: Bytes!
  taskCoordinator: Bytes!
  taskAuditor: Bytes!

  disabled: Boolean!

  "The registration request that created this model"
  registrationRequest: ModelRegistrationRequest!

  manifestHistory: [ManifestUpdateRequest!]! @derivedFrom(field: "model")
  disableEvents: [ModelKillSwitchEvent!]! @derivedFrom(field: "model")
  globalIterations: [GlobalIteration!]! @derivedFrom(field: "model")

  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
}

# ─────────────────────────────────────────────────────────────────────────────
# Model Registry — manifest update requests
# ─────────────────────────────────────────────────────────────────────────────

"""A manifest update request submitted by the model owner for DAO review."""
type ManifestUpdateRequest @entity {
  "requestId as decimal string"
  id: ID!

  requestId: BigInt!
  model: Model!

  "Derived from Model.owner (only the model owner can request a manifest update)"
  requester: Bytes!

  feePaid: BigInt!
  newManifestCID: Bytes!

  processed: Boolean!
  approved: Boolean

  submittedAtBlock: BigInt!
  submittedAtTimestamp: BigInt!
  processedAtBlock: BigInt
  processedAtTimestamp: BigInt
}

# ─────────────────────────────────────────────────────────────────────────────
# Model Registry — kill-switch history
# ─────────────────────────────────────────────────────────────────────────────

"""Records each ModelDisabled / ModelEnabled transition."""
type ModelKillSwitchEvent @entity {
  "txHash-logIndex"
  id: ID!

  model: Model!
  disabled: Boolean!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ─────────────────────────────────────────────────────────────────────────────
# Model Registry — fee governance
# ─────────────────────────────────────────────────────────────────────────────

"""
A snapshot of protocol fees at the time of a fee-change event.
One snapshot per fee-change transaction; latest snapshot is the current fee schedule.
"""
type FeeSnapshot @entity {
  "txHash-logIndex"
  id: ID!

  openSourceFee: BigInt!
  proprietaryFee: BigInt!
  openSourceUpdateFee: BigInt!
  proprietaryUpdateFee: BigInt!

  "atomic = fired by setFees(); granular = fired by an individual setter"
  updateKind: String!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""An ETH fee sweep from DINModelRegistry to the DinFeeRouter (FeesSweptToRouter)."""
type RegistryFeeWithdrawal @entity {
  "txHash-logIndex"
  id: ID!

  "The fee router at the time of the sweep, read from feeRouter()"
  to: Bytes!
  amount: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""Records every change of the fee router address on DINModelRegistry (FeeRouterUpdated)."""
type FeeRouterUpdate @entity {
  "txHash-logIndex"
  id: ID!

  "The contract that emitted the event"
  sourceContract: Bytes!
  feeRouter: Bytes!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ─────────────────────────────────────────────────────────────────────────────
# Model Registry — governance key rotation
# ─────────────────────────────────────────────────────────────────────────────

"""Records every DAOAdmin (Ownable owner) transfer, from OwnershipTransferred."""
type DAOAdminTransfer @entity {
  "txHash-logIndex"
  id: ID!

  oldAdmin: Bytes!
  newAdmin: Bytes!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ─────────────────────────────────────────────────────────────────────────────
# Validator stake — per-validator aggregate
# ─────────────────────────────────────────────────────────────────────────────

"""
Aggregate state for a single validator address, updated on every relevant event.
Derived status (Active / Exiting / Jailed / Blacklisted / None) is computed
from the event stream — no dedicated ValidatorStatusChanged event exists yet.
"""
type Validator @entity {
  "validator address as hex string"
  id: ID!

  address: Bytes!

  activeStake: BigInt!
  pendingWithdrawal: BigInt!
  withdrawAvailableAt: BigInt

  "Active | Exiting | Jailed | Blacklisted | None"
  status: String!

  totalStaked: BigInt!
  totalSlashed: BigInt!
  totalWithdrawn: BigInt!

  blacklisted: Boolean!

  "Timestamp until which the validator is jailed, or null if not jailed. Cleared on reactivation."
  jailedUntil: BigInt

  "Running count of active task-contract registrations (from ActiveRegistrationIncremented/Decremented)."
  activeRegistrations: Int!

  "Most recently registered encryption public key, or null if none registered."
  encryptionKey: Bytes

  stakeEvents: [StakeEvent!]! @derivedFrom(field: "validator")
  slashEvents: [SlashEvent!]! @derivedFrom(field: "validator")
  unstakeRequests: [UnstakeRequest!]! @derivedFrom(field: "validator")
  withdrawalClaims: [WithdrawalClaim!]! @derivedFrom(field: "validator")
  jailEvents: [JailEvent!]! @derivedFrom(field: "validator")
  s6NoParticipationRecords: [S6NoParticipationRecord!]! @derivedFrom(field: "validator")
  s6PartialSlashEvents: [S6PartialSlashEvent!]!         @derivedFrom(field: "validator")
  escalationsS5: [ValidatorEscalationS5!]!              @derivedFrom(field: "validator")
  escalationsS5Global: [ValidatorEscalationS5Global!]!  @derivedFrom(field: "validator")
  encryptionKeyHistory: [EncryptionKeyRegistration!]!   @derivedFrom(field: "validator")
}

# ─────────────────────────────────────────────────────────────────────────────
# Validator stake — individual events
# ─────────────────────────────────────────────────────────────────────────────

"""A DIN stake deposit by a validator."""
type StakeEvent @entity {
  "txHash-logIndex"
  id: ID!

  validator: Validator!
  amount: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""A slash applied to a validator's stake."""
type SlashEvent @entity {
  "txHash-logIndex"
  id: ID!

  validator: Validator!
  amount: BigInt!
  reason: Bytes!

  "Address of the slasher contract (DINTaskCoordinator or DINTaskAuditor)"
  slasherContract: Bytes!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""An unstake (unbonding) request submitted by a validator."""
type UnstakeRequest @entity {
  "txHash-logIndex"
  id: ID!

  validator: Validator!
  amount: BigInt!
  withdrawAvailableAt: BigInt!

  claimed: Boolean!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""A completed withdrawal after the unbonding period."""
type WithdrawalClaim @entity {
  "txHash-logIndex"
  id: ID!

  validator: Validator!
  amount: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""
A jail applied to a validator (extend-only). A validator stays Jailed until
they call reactivate() after the jail period expires — there is no silent
auto-return (see DinValidatorStake._syncValidatorStatus()).
"""
type JailEvent @entity {
  "txHash-logIndex"
  id: ID!

  validator: Validator!

  "Timestamp until which the validator is jailed"
  jailedUntil: BigInt!

  "Arbitrary slasher-supplied reason (e.g. keccak('offline'))"
  reason: Bytes!

  "Address of the slasher contract that issued the jail"
  slasherContract: Bytes!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ─────────────────────────────────────────────────────────────────────────────
# Validator stake — governance parameters
# ─────────────────────────────────────────────────────────────────────────────

"""
Singleton (id "singleton") mirroring the DAO-settable parameters on
DinValidatorStake. Kept up to date by the MinStakeUpdated,
UnbondingPeriodUpdated, and MaxConcurrentRegistrationsPerStakeUnitUpdated
handlers. Defaults to the initialize() values (minStake = 10 DIN,
unbondingPeriod = 7 days).
"""
type StakeGovernance @entity {
  "singleton"
  id: ID!

  minStake: BigInt!
  unbondingPeriod: BigInt!
  maxConcurrentRegistrationsPerStakeUnit: BigInt!

  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
}

"""
DAO-level per-model stake bounds. Inert storage on the contract (not yet
consumed by task-contract registration); indexed here for governance
audit-trail visibility.
"""
type ModelStakeBounds @entity {
  "modelId as string"
  id: ID!

  modelId: BigInt!
  min: BigInt!
  max: BigInt!

  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
}

# ─────────────────────────────────────────────────────────────────────────────
# Validator stake — slasher registry
# ─────────────────────────────────────────────────────────────────────────────

"""
A slasher contract authorized to call DinValidatorStake.slash().
sourceContract distinguishes DinCoordinator-originated events from
DinValidatorStake-originated events — both emit identical SlasherContractAdded/
Removed signatures (see event-coverage-audit.md §5).
The canonical active-slasher set is derived from DinValidatorStake events only.
"""
type SlasherRegistration @entity {
  "slasherAddress-sourceContract as hex pair"
  id: ID!

  slasherAddress: Bytes!

  "DinCoordinator or DinValidatorStake — the contract that emitted the event"
  sourceContract: Bytes!

  active: Boolean!

  addedAtBlock: BigInt!
  addedAtTimestamp: BigInt!
  removedAtBlock: BigInt
  removedAtTimestamp: BigInt
}

# ─────────────────────────────────────────────────────────────────────────────
# Validator stake — S5/S6 penalty mechanism
# ─────────────────────────────────────────────────────────────────────────────

"""Singleton (id "singleton") mirroring the S5 global-penalty parameters."""
type S5GlobalParams @entity {
  "singleton"
  id: ID!
  window: BigInt!
  threshold: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
}

"""Singleton (id "singleton") mirroring the S5 recidivism-penalty parameters."""
type S5RecidivismParams @entity {
  "singleton"
  id: ID!
  window: BigInt!
  threshold: BigInt!
  jailDuration: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
}

"""Singleton (id "singleton") mirroring the S6 no-participation threshold."""
type S6Params @entity {
  "singleton"
  id: ID!
  threshold: BigInt!
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!
}

"""A no-participation record emitted each time a validator's S6 count increments."""
type S6NoParticipationRecord @entity {
  "txHash-logIndex"
  id: ID!
  validator: Validator!
  count: BigInt!
  reason: Bytes!
  slasherContract: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""A partial slash fired when a validator crosses the S6 no-participation threshold."""
type S6PartialSlashEvent @entity {
  "txHash-logIndex"
  id: ID!
  validator: Validator!
  slashedAmount: BigInt!
  slasherContract: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""An S5 escalation slash (per-GI recidivism threshold exceeded)."""
type ValidatorEscalationS5 @entity {
  "txHash-logIndex"
  id: ID!
  validator: Validator!
  slashedAmount: BigInt!
  giIndex: BigInt!
  slasherContract: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""An S5 global escalation slash (global recidivism threshold exceeded)."""
type ValidatorEscalationS5Global @entity {
  "txHash-logIndex"
  id: ID!
  validator: Validator!
  slashedAmount: BigInt!
  globalCount: BigInt!
  slasherContract: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""A change to the slash treasury address."""
type SlashTreasuryUpdate @entity {
  "txHash-logIndex"
  id: ID!
  treasury: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""An encryption key registration or update by a validator."""
type EncryptionKeyRegistration @entity {
  "txHash-logIndex"
  id: ID!
  validator: Validator!
  pubkey: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ─────────────────────────────────────────────────────────────────────────────
# DinCoordinator — ETH deposits and treasury
# ─────────────────────────────────────────────────────────────────────────────

"""An ETH deposit that minted DIN tokens for a user."""
type DINMintEvent @entity {
  "txHash-logIndex"
  id: ID!

  user: Bytes!
  ethAmount: BigInt!
  dinAmount: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""A change to the DIN-per-ETH exchange rate."""
type ExchangeRateSnapshot @entity {
  "txHash-logIndex"
  id: ID!

  newRate: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ─────────────────────────────────────────────────────────────────────────────
# DinToken — mint and transfer history
# ─────────────────────────────────────────────────────────────────────────────

"""A DIN token mint (always from DinCoordinator via depositAndMint)."""
type TokenMintEvent @entity {
  "txHash-logIndex"
  id: ID!

  to: Bytes!
  amount: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""
A DIN ERC20 transfer. Indexed from the standard Transfer event.
Includes zero-address mint/burn transfers for completeness.
"""
type TokenTransferEvent @entity {
  "txHash-logIndex"
  id: ID!

  from: Bytes!
  to: Bytes!
  amount: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# =============================================================================
# Task-level contracts — dynamic data sources
#
# DINTaskCoordinator and DINTaskAuditor are deployed once per model (not once
# globally). The subgraph tracks them via data source templates instantiated
# when DINModelRegistry emits ModelApproved.

# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# Global Iteration lifecycle
# ─────────────────────────────────────────────────────────────────────────────

"""
A single Global Iteration (GI) for one federated-learning model.
Central entity linking registrations, batches, submissions, and scoring.
"""
type GlobalIteration @entity {
  "taskCoordinatorAddress-gi (hex-decimal)"
  id: ID!

  gi: BigInt!
  taskCoordinator: Bytes!

  "Back-reference to the platform-level Model entity"
  model: Model!

  """Current GIstates enum value as uint8, updated from GIStateChanged.
  Starts at 5 (GIstarted) — the first state reachable after model registration."""
  currentState: Int!

  aggregatorRegistrations: [AggregatorRegistration!]! @derivedFrom(field: "globalIteration")
  auditorRegistrations: [AuditorRegistration!]!      @derivedFrom(field: "globalIteration")
  tier1Batches: [Tier1Batch!]!                       @derivedFrom(field: "globalIteration")
  tier2Batches: [Tier2Batch!]!                       @derivedFrom(field: "globalIteration")
  auditBatches: [AuditBatch!]!                       @derivedFrom(field: "globalIteration")
  localModelSubmissions: [LocalModelSubmission!]!    @derivedFrom(field: "globalIteration")
  aggregatorSlashEvents: [AggregatorSlashEvent!]!    @derivedFrom(field: "globalIteration")
  auditorSlashEvents: [AuditorSlashEvent!]!          @derivedFrom(field: "globalIteration")
  stateTransitions: [GIStateTransition!]!            @derivedFrom(field: "globalIteration")
  rewardDeposits: [RewardDeposit!]!                   @derivedFrom(field: "globalIteration")
  rewardSettlements: [RewardSettlement!]!             @derivedFrom(field: "globalIteration")
  auditScoreCommitments: [AuditScoreCommitment!]!     @derivedFrom(field: "globalIteration")
  testDataCommitments: [TestDataCommitment!]!         @derivedFrom(field: "globalIteration")
  testDataDisputes: [TestDataDispute!]!               @derivedFrom(field: "globalIteration")
  auditorScoreDeviations: [AuditorScoreDeviation!]!   @derivedFrom(field: "globalIteration")
  t1AggregationCommitments: [T1AggregationCommitment!]! @derivedFrom(field: "globalIteration")
  t2AggregationCommitments: [T2AggregationCommitment!]! @derivedFrom(field: "globalIteration")
  seedLocks: [SeedLock!]!                             @derivedFrom(field: "globalIteration")
  aggregationDisputes: [AggregationDispute!]!         @derivedFrom(field: "globalIteration")

  "T2 winning CID — the new global model. Set by T2Finalized."
  globalModelCID: Bytes

  "True once endGI() has been called and GIStateChanged(GIended) fires."
  ended: Boolean!

  startedAtBlock: BigInt!
  startedAtTimestamp: BigInt!
  endedAtBlock: BigInt
  endedAtTimestamp: BigInt
}

# ─────────────────────────────────────────────────────────────────────────────
# Validator registrations per GI
# ─────────────────────────────────────────────────────────────────────────────

"""An aggregator that registered for a specific Global Iteration."""
type AggregatorRegistration @entity {
  "taskCoordinatorAddress-gi-validatorAddress"
  id: ID!

  globalIteration: GlobalIteration!
  validator: Bytes!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""An auditor that registered for a specific Global Iteration."""
type AuditorRegistration @entity {
  "taskAuditorAddress-gi-auditorAddress"
  id: ID!

  globalIteration: GlobalIteration!
  auditor: Bytes!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ─────────────────────────────────────────────────────────────────────────────
# Aggregation batches (T1 and T2)
# ─────────────────────────────────────────────────────────────────────────────

"""
A Tier-1 aggregation batch. Created by autoCreateTier1AndTier2().
Multiple T1 batches exist per GI; each covers a sub-set of approved models.
"""
type Tier1Batch @entity {
  "taskCoordinatorAddress-gi-batchId"
  id: ID!

  globalIteration: GlobalIteration!
  batchId: BigInt!

  t1Submissions: [T1AggregationSubmission!]! @derivedFrom(field: "tier1Batch")

  "True once finalizeT1Aggregation() selects the majority CID."
  finalized: Boolean!

  "Majority-agreed aggregation CID. Set by T1BatchFinalized."
  winningCID: Bytes

  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  finalizedAtBlock: BigInt
  finalizedAtTimestamp: BigInt
}

"""
The single Tier-2 aggregation batch per GI. Created alongside T1 batches.
Its winningCID is the new global model for the iteration.
"""
type Tier2Batch @entity {
  "taskCoordinatorAddress-gi (batchId is always 0)"
  id: ID!

  globalIteration: GlobalIteration!

  t2Submissions: [T2AggregationSubmission!]! @derivedFrom(field: "tier2Batch")

  "True once finalizeT2Aggregation() selects the majority CID."
  finalized: Boolean!

  "Majority-agreed CID — the new global model for this GI. Set by T2Finalized."
  globalModelCID: Bytes

  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
  finalizedAtBlock: BigInt
  finalizedAtTimestamp: BigInt
}

# ─────────────────────────────────────────────────────────────────────────────
# Audit batches
# ─────────────────────────────────────────────────────────────────────────────

"""
An audit batch created by DINTaskAuditor.createAuditorsBatches().
Groups a subset of auditors with a subset of local model submissions.
"""
type AuditBatch @entity {
  "taskAuditorAddress-gi-batchId"
  id: ID!

  globalIteration: GlobalIteration!
  batchId: BigInt!

  scoreSubmissions: [AuditScoreSubmission!]! @derivedFrom(field: "auditBatch")
  scoreCommitments: [AuditScoreCommitment!]! @derivedFrom(field: "auditBatch")
  eligibilityVotes: [EligibilityVote!]!      @derivedFrom(field: "auditBatch")
  eligibilityResults: [EligibilityResult!]!  @derivedFrom(field: "auditBatch")
  auditorSlashEvents: [AuditorSlashEvent!]!  @derivedFrom(field: "auditBatch")
  scoreDeviations: [AuditorScoreDeviation!]! @derivedFrom(field: "auditBatch")
  testDataCommitment: TestDataCommitment     @derivedFrom(field: "auditBatch")
  encryptedTestDataKeys: EncryptedTestDataKeys @derivedFrom(field: "auditBatch")
  testDataDispute: TestDataDispute           @derivedFrom(field: "auditBatch")

  "True once BatchPendingReassignment fires for this batch."
  pendingReassignment: Boolean!

  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
}

# ─────────────────────────────────────────────────────────────────────────────
# Local model submissions
# ─────────────────────────────────────────────────────────────────────────────

"""
A local model submitted by a client during the LMS phase.
Populated from the LocalModelSubmitted event.
Until that event lands this entity will not be populated.
"""
type LocalModelSubmission @entity {
  "taskAuditorAddress-gi-modelIndex"
  id: ID!

  globalIteration: GlobalIteration!
  modelIndex: BigInt!
  client: Bytes!
  modelCID: Bytes!

  "Set once EligibilityFinalized fires for this modelIndex."
  eligible: Boolean
  "Set once finalizeEvaluation() is called (derived from EligibilityFinalized + AuditScoreSubmitted)."
  finalAvgScore: BigInt
  "True if eligible and finalAvgScore >= passScore."
  approved: Boolean

  scoreSubmissions: [AuditScoreSubmission!]! @derivedFrom(field: "localModelSubmission")
  eligibilityVotes: [EligibilityVote!]!      @derivedFrom(field: "localModelSubmission")
  eligibilityResult: EligibilityResult       @derivedFrom(field: "localModelSubmission")

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ─────────────────────────────────────────────────────────────────────────────
# Aggregation submissions (T1 and T2)
# ─────────────────────────────────────────────────────────────────────────────

"""
A T1 aggregation CID submitted by an aggregator for a specific batch.
Populated from the T1AggregationSubmitted event.
"""
type T1AggregationSubmission @entity {
  "taskCoordinatorAddress-gi-batchId-aggregatorAddress"
  id: ID!

  tier1Batch: Tier1Batch!
  aggregator: Bytes!
  cid: Bytes!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""
A T2 aggregation CID submitted by an aggregator.
batchId is always 0. Populated from the T2AggregationSubmitted event.
"""
type T2AggregationSubmission @entity {
  "taskCoordinatorAddress-gi-aggregatorAddress"
  id: ID!

  tier2Batch: Tier2Batch!
  aggregator: Bytes!
  cid: Bytes!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ─────────────────────────────────────────────────────────────────────────────
# Audit scoring and eligibility
# ─────────────────────────────────────────────────────────────────────────────

"""An audit score submitted by a single auditor for one local model."""
type AuditScoreSubmission @entity {
  "taskAuditorAddress-gi-batchId-auditorAddress-modelIndex"
  id: ID!

  auditBatch: AuditBatch!
  localModelSubmission: LocalModelSubmission!
  auditor: Bytes!
  score: BigInt!

  "The commit-reveal commitment this score was revealed against, if any."
  commitment: AuditScoreCommitment

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""An eligibility vote cast by a single auditor for one local model."""
type EligibilityVote @entity {
  "taskAuditorAddress-gi-batchId-modelIndex-auditorAddress"
  id: ID!

  auditBatch: AuditBatch!
  localModelSubmission: LocalModelSubmission!
  auditor: Bytes!
  vote: Boolean!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""
The finalized eligibility result for a local model once quorum is reached.
One record per modelIndex per GI.
"""
type EligibilityResult @entity {
  "taskAuditorAddress-gi-batchId-modelIndex"
  id: ID!

  auditBatch: AuditBatch!
  localModelSubmission: LocalModelSubmission!
  eligible: Boolean!
  totalVotes: BigInt!

  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ─────────────────────────────────────────────────────────────────────────────
# Slash events (task-level)
# ─────────────────────────────────────────────────────────────────────────────

"""A slash applied to an aggregator by DINTaskCoordinator.slashAggregators()."""
type AggregatorSlashEvent @entity {
  "txHash-logIndex"
  id: ID!

  globalIteration: GlobalIteration!
  batchId: BigInt!
  aggregator: Bytes!
  reason: Bytes!
  requestedAmount: BigInt!
