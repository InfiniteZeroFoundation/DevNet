# Dependabot config. Version updates are off (open-pull-requests-limit: 0);
# this file exists only to set ignore rules for the security-update PRs that
# Dependabot opens against develop.
#
# torch is ignored in the example-model requirements because Dependabot bumps
# it on its own, leaving torchvision/triton/nvidia pins that require the old
# version (PRs No. 318, 325 and 333 were closed for this). These files are also
# pinned to IPFS by CID in the model manifests and din_info default_requirements,
# so torch moves only in the coordinated update tracked in issue No. 298:
# torch, torchvision, triton and the nvidia pins together, re-uploaded, with the
# CIDs updated.
version: 2
updates:
  - package-ecosystem: pip
    # Dependabot matches each manifest's own directory, so every directory
    # holding one of the 13 requirements files is listed explicitly.
    directories:
      - /cache_model_0
      - /cache_model_0/requirements/aggregators
      - /cache_model_0/requirements/auditors
      - /cache_model_0/requirements/clients
      - /cache_model_0/requirements/modelowner
      - /cache_model_1
      - /cache_model_1/requirements/aggregators
      - /cache_model_1/requirements/auditors
      - /cache_model_1/requirements/clients
      - /cache_model_1/requirements/modelowner
      - /cid_services/requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: torch
