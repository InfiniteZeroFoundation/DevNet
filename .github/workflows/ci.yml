name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Versions this pipeline was measured against. See plan 2.4 / 2.9.
  FOUNDRY_VERSION: v1.7.1
  PIP_CONSTRAINT: .github/constraints-ci.txt

# Actions already defaults to bash on Linux, but ci-ok's result loop relies on
# word splitting, which zsh (and dash) do not do. Stated rather than assumed.
defaults:
  run:
    shell: bash

jobs:
  solidity:
    name: Solidity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive   # forge-std + 3 OZ libs; see plan 2.3
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            foundry/package-lock.json
            hardhat/package-lock.json
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # Pinned rather than `stable`: forge's diagnostics are parsed by the
          # lint gate and its compiler is blocking. See plan 2.9.
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Record the toolchain actually installed
        run: forge --version

      # Must precede `forge test`: Upgrades.validateImplementation shells out to
      # @openzeppelin/upgrades-core over FFI, and letting npx fetch it at test
      # time races across the parallel tests. See plan 2.2.
      - name: Install foundry npm deps
        working-directory: foundry
        run: npm ci

      - name: forge build
        working-directory: foundry
        run: forge build

      # EIP-170/EIP-3860 budget for every foundry/src contract: fails below a
      # 1,024 B runtime margin, warns below 2,048 B. Reads artifacts directly
      # because `forge build --sizes` omits DINTaskAuditor. Issue #201 Part A.
      - name: contract size gate
        working-directory: foundry
        run: python3 ../.github/scripts/contract_size_gate.py

      - name: forge test
        working-directory: foundry
        run: forge test

      # Advisory until PR 3. `--json` writes diagnostics to stderr and cannot be
      # combined with `--color`; the gate fails closed on a nonzero forge status,
      # an unparseable stream, or any warning/error. See plan 2.7.
      - name: forge lint (advisory)
        working-directory: foundry
        continue-on-error: true
        run: |
          set +e
          forge lint --json 2> "$RUNNER_TEMP/lint.json"
          forge_status=$?
          set -e
          echo "forge lint exit status: $forge_status"
          if [ "$forge_status" -ne 0 ]; then
            echo "::error::forge lint itself failed"
            cat "$RUNNER_TEMP/lint.json" || true
            exit 1
          fi
          python3 ../.github/scripts/forge_lint_gate.py < "$RUNNER_TEMP/lint.json"

      - name: Install hardhat deps
        working-directory: hardhat
        run: npm ci

      - name: hardhat compile
        working-directory: hardhat
        run: npx hardhat compile

      - name: hardhat test
        working-directory: hardhat
        run: npx hardhat test

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      # CPU wheel is 178 MB; the default index resolves a ~4 GB CUDA stack that
      # nothing here uses. The version comes from PIP_CONSTRAINT. See plan 2.4.
      - name: Install torch (CPU)
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install dincli + test deps
        run: python -m pip install -e ".[test]"

      - name: ruff (advisory)
        continue-on-error: true
        run: |
          python -m pip install ruff
          ruff check .

      # Excludes tests/dincli/ (Docker + IPFS + live chain) via the directory
      # hook. pytest exits 5 if this ever selects nothing, so a broken hook
      # fails rather than passes silently. See plan 2.6.
      - name: pytest
        run: pytest -m "not integration" -q

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Relative link check
        run: python .github/scripts/check_doc_links.py Documentation

  # Path filter for the integration job. The workflow itself stays unfiltered
  # (see ci-ok), so the filter is a job: a change that does not touch the
  # suite's inputs skips `integration` rather than the whole run. Anything it
  # cannot diff (a force push, a missing `before` commit) runs the suite.
  integration-paths:
    name: Integration paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2   # a PR's merge commit plus its base parent
      - name: Diff against the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          elif git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null; then
            base=$BEFORE
          fi
          if [ -z "$base" ]; then
            echo "no base to diff against; running the suite"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          if grep -qE '^(foundry/(src|script)/|foundry/anvil\.sh$|hardhat/|dincli/|tests/dincli/|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/changed.txt"

  # tests/dincli/ full-GI suite on Anvil + offline Kubo + Docker (issue #228).
  # Non-blocking: ci-ok does not wait for it and continue-on-error keeps a red
  # run from failing the workflow. Make it required once it has been stable for
  # a couple of weeks: add it to ci-ok's needs and accept `skipped` there.
  integration:
    name: Integration (full GI)
    needs: integration-paths
    if: needs.integration-paths.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A full GI trains 9 clients and runs auditor and aggregator containers.
    # The measured runtime goes to the step summary; tighten this once known.
    timeout-minutes: 90
    continue-on-error: true
    env:
      # Kubo for the harness's offline IPFS daemon; the checksum is the sha256
      # of this release asset.
      KUBO_VERSION: v0.43.1
      KUBO_SHA256: 3f2bf974ab2a3ec6d997fac7d8cb46f59983a7cddd0b55ef998e6ce379155fb2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            foundry/package-lock.json
            hardhat/package-lock.json
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      # forge (svm-rs) installs solc into ~/.local/share/svm only when ~/.svm is
      # missing and ~/.local/share already exists, otherwise into ~/.svm (the
      # fresh-runner case). Which one is only known after forge build, so cache
      # both; the step after forge build picks the one in use.
      - name: Cache Solidity compilers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.svm
            ~/.local/share/svm
            ~/.cache/hardhat-nodejs
          key: solc-${{ runner.os }}-${{ hashFiles('foundry/foundry.toml', 'hardhat/hardhat.config.ts') }}

      - name: Install Kubo
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kubo.tar.gz" \
            "https://github.com/ipfs/kubo/releases/download/${KUBO_VERSION}/kubo_${KUBO_VERSION}_linux-amd64.tar.gz"
          echo "${KUBO_SHA256}  $RUNNER_TEMP/kubo.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubo.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kubo" >> "$GITHUB_PATH"

      - name: Record the toolchain actually installed
        run: |
          forge --version
          anvil --version
          ipfs --version
          docker version --format 'docker {{.Server.Version}}'

      # Both trees are built here, in the runner's normal environment, so the
      # compilers land in the cache above. The harness then rebuilds in fresh
      # isolated state, where both builds are up to date: hardhat reports
      # "Nothing to compile" without asking for a compiler, and forge gets solc
      # from DIN_TEST_SVM_DIR. Without this the harness would download both
      # compilers and run a full via_ir build inside its 180 s compile timeout.
      - name: Install foundry npm deps
        working-directory: foundry
        run: npm ci
      - name: forge build
        working-directory: foundry
        run: forge build
      # Same rule as svm-rs, now that forge has created the directory it uses.
      - name: Locate the solc install directory
        id: svm
        run: |
          if [ -d "$HOME/.svm" ]; then dir="$HOME/.svm"; else dir="${XDG_DATA_HOME:-$HOME/.local/share}/svm"; fi
          ls -d "$dir"/*/ > /dev/null 2>&1 || { echo "::error::no solc versions in $dir after forge build"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Install hardhat deps
        working-directory: hardhat
        run: npm ci
      - name: hardhat compile
        working-directory: hardhat
        run: npx hardhat compile

      - name: Install torch (CPU)
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install dincli + test deps
        run: python -m pip install -e ".[test]"

      # dincli builds this image on first use otherwise, inside a Phase 4
      # command's 120 s timeout. Same Dockerfile, context and tag as
      # dincli/cli/worker.py:ensure_worker_image. The tag is read from the
      # source, not imported: importing dincli prints to stdout without a config.
      - name: Build the din-worker image
        run: |
          image=$(sed -n 's/^WORKER_IMAGE = "\(.*\)"$/\1/p' dincli/cli/worker.py)
          test -n "$image" || { echo "::error::WORKER_IMAGE not found in dincli/cli/worker.py"; exit 1; }
          docker build -f dincli/docker/worker/Dockerfile -t "$image" .

      # Scratch must not exist yet (the harness creates and deletes it); the
      # results dir outlives it and holds the compile, chain and IPFS logs.
      # A step timeout below the job's, so a hung suite fails this step (and
      # the upload below still runs) instead of the whole job being cancelled.
      - name: Full-GI integration suite
        timeout-minutes: 85
        env:
          DIN_TEST_ISOLATED: '1'
          DIN_TEST_TMPDIR: ${{ runner.temp }}/din-scratch
          DIN_TEST_RESULTS_DIR: ${{ runner.temp }}/din-results
          DIN_TEST_SVM_DIR: ${{ steps.svm.outputs.dir }}
        run: |
          mkdir -p "$DIN_TEST_RESULTS_DIR"
          start=$(date +%s)
          status=0
          set -o pipefail
          pytest tests/dincli/ -v -x -m integration --tb=short 2>&1 \
            | tee "$DIN_TEST_RESULTS_DIR/pytest.log" || status=$?
          elapsed=$(( $(date +%s) - start ))
          echo "Full-GI integration suite: exit ${status} after $((elapsed / 60)) min $((elapsed % 60)) s" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload integration logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: ${{ runner.temp }}/din-results
          if-no-files-found: warn
          retention-days: 14

  # The only required status check. Keeps branch protection to one context and
  # avoids the path-filter/required-check deadlock. See plan 2.8.
  ci-ok:
    name: CI OK
    if: always()
    needs: [solidity, python, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
          echo "all jobs succeeded"
